<!-- Standalone Google Gemini & Localhost Compatibility Engine -->
<script>
(function() {
  function extractTag(text, tag) {
    const regex = new RegExp('<' + tag + '>([\\s\\S]*?)<\\/' + tag + '>', 'gi');
    let match, lastMatch = null;
    while ((match = regex.exec(text)) !== null) {
      lastMatch = match;
    }
    return lastMatch ? lastMatch[1].trim() : '';
  }

  // The shared key now lives only on Netlify (GEMINI_API_KEY env variable).
  // A key saved here in the browser is an optional personal override.
  function getActiveKey() {
    const k = (localStorage.getItem('selfctrl.gemini_key') || '').trim();
    return k.startsWith('AQ.') ? '' : k;
  }
  function hasServerKey() {
    return localStorage.getItem('selfctrl.has_server_key') === 'true';
  }
  function getActiveModel() {
    return localStorage.getItem('selfctrl.gemini_model') || 'gemini-3.1-flash-lite';
  }

  function cleanAndParseJson(str) {
    if (!str) return null;
    let cleaned = String(str).trim();
    if (cleaned.startsWith('```')) {
      cleaned = cleaned.replace(/^```(?:json)?\s*\n?/, '').replace(/\n?```\s*$/, '').trim();
    }
    return JSON.parse(cleaned);
  }

  window.testGeminiConnection = async function(key, model) {
    const k = (key || getActiveKey()).trim();
    const m = (model || getActiveModel()).trim();
    if (k.startsWith('AQ.')) {
      throw new Error('This key starts with "AQ...", which is an expired temporary credential. Please replace it with a permanent API key from Google AI Studio (starts with "AIzaSy...").');
    }

    let proxyErr = '';
    // 1. Try server proxy (if running on localhost or with serverless functions)
    try {
      const res = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...(k ? { apiKey: k } : {}),
          model: m,
          prompt: 'Reply with JSON only: {"status":"ok","connected":true}'
        })
      });
      const ctype = res.headers.get('content-type') || '';
      if (res.ok && ctype.includes('application/json')) {
        const d = await res.json();
        if (!d.error) return { ok: true, model: m, via: 'Server Proxy' };
        proxyErr = d.error;
      }
    } catch(e) {}

    // 2. Direct browser call, only when the user saved their own key
    if (!k) throw new Error(proxyErr || 'Server function is not reachable. Make sure the api folder is deployed and GEMINI_API_KEY is set in your hosting settings.');
    const directRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${k}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: 'Reply with JSON only: {"status":"ok","connected":true}' }] }],
        generationConfig: { responseMimeType: 'application/json' }
      })
    });

    const ctype = directRes.headers.get('content-type') || '';
    if (ctype.includes('application/json')) {
      const d = await directRes.json();
      if (d.error) {
        throw new Error(d.error.message || `Gemini error: ${directRes.status}`);
      }
      const txt = d.candidates?.[0]?.content?.parts?.[0]?.text;
      if (txt) {
        cleanAndParseJson(txt);
        return { ok: true, model: m, via: 'Direct Gemini API' };
      }
    }

    throw new Error(proxyErr || `Unable to reach Gemini API (status ${directRes.status})`);
  };

  async function callGeminiBackend(prompt, modelTier) {
    const localKey = getActiveKey();
    const localModel = getActiveModel();

    // 1. Server proxy (key lives on the server). Give up after 50s so the UI never hangs.
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 50000);
      const res = await fetch('/api/gemini', {
        signal: ctrl.signal,
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...(localKey ? { apiKey: localKey } : {}),
          model: localModel,
          prompt: prompt
        })
      });
      clearTimeout(timer);
      const ctype = res.headers.get('content-type') || '';
      if (res.ok && ctype.includes('application/json')) {
        const json = await res.json();
        if (!json.error) return json;
      } else if (ctype.includes('application/json')) {
        const err = await res.json().catch(() => ({}));
        console.warn('Gemini server error:', err.error || res.status);
      }
    } catch(e) { console.warn('Gemini request failed or timed out:', e.message); }

    // 2. Direct browser fetch to Google Gemini API (works on static hosts like Netlify Drop!)
    if (localKey) {
      const modelsToTry = [localModel];
      const preferredFallbacks = ['gemini-3.1-flash-lite', 'gemini-2.5-flash'];
      for (const f of preferredFallbacks) {
        if (!modelsToTry.includes(f)) modelsToTry.push(f);
      }

      for (const m of modelsToTry) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${localKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: 'application/json', temperature: 0.3 }
            })
          });
          const ctype = res.headers.get('content-type') || '';
          if (ctype.includes('application/json')) {
            const data = await res.json();
            const txt = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (txt) {
              return cleanAndParseJson(txt);
            }
          }
        } catch(e) {}
      }
    }

    return null;
  }

  async function simulateOffline(prompt, options) {
    if (prompt.includes('Extract structure')) {
      const prob = extractTag(prompt, 'problem');
      const p = prob.toLowerCase();
      let cat = 'Decision Making';
      let intents = ['compare_options', 'problem_solving'];
      let opts = ['Strategic Option A', 'Practical Option B'];

      if (/intern|offer|job|career|salary/i.test(p)) {
        cat = 'Career';
        intents = ['career_decision', 'compare_options'];
        opts = ['Fast-growing Startup Offer', 'Established Enterprise Corporate Offer'];
      } else if (/laptop|buy|purchase|budget|price|₹|\$/i.test(p)) {
        cat = 'Shopping';
        intents = ['purchase_decision', 'compare_options'];
        opts = ['Performance Workstation Laptop', 'Ultra-portable Daily Laptop'];
      } else if (/deadline|exam|week|schedule|time/i.test(p)) {
        cat = 'Planning';
        intents = ['time_management', 'make_plan'];
        opts = ['Strict Impact Prioritization (Triage)', 'Timeboxed Execution & Negotiation'];
      } else if (/travel|flight|trip|train/i.test(p)) {
        cat = 'Travel';
        intents = ['travel_planning'];
        opts = ['Express Direct Route', 'Budget Flexible Route'];
      } else if (/skill|learn|course|deepen/i.test(p)) {
        cat = 'Education';
        intents = ['education_decision', 'goal_planning'];
        opts = ['Vertical Mastery (Deep Core Skill)', 'Horizontal Breadth (Adjacent Skills)'];
      }

      const constraints = [];
      const money = prob.match(/₹\s*[\d,]+|\$\s*[\d,]+/g);
      if (money) constraints.push('Budget limit: ' + money.join(', '));
      if (/deadline|this week|urgent|tomorrow/i.test(p)) constraints.push('Strict timeline / upcoming deadlines');
      if (!constraints.length) constraints.push('Resource and focus boundaries');

      return {
        intents,
        category: cat,
        options: opts,
        constraints,
        missing_information: ['Specific day-to-day team expectations', 'Secondary compensation or perks'],
        requires_realtime_data: /today|tomorrow|flight|train|price|live|news/i.test(p),
        clarifying_question: null
      };
    }

    if (prompt.includes('Analyze this problem for this person')) {
      const prob = extractTag(prompt, 'problem');
      const twinRaw = extractTag(prompt, 'twin');
      let twin = {};
      try { twin = JSON.parse(twinRaw); } catch(e) {}

      if (options && typeof options.onText === 'function') {
        const drafts = [
          'Evaluating against your defined Twin values...',
          'Scoring options across constraints and preferences...',
          'Synthesizing decision matrix and next steps...'
        ];
        for (const d of drafts) {
          options.onText({ text: d });
          await new Promise(r => setTimeout(r, 120));
        }
      }

      const p = prob.toLowerCase();
      let cat = 'Decision Making';
      let oNames = ['Option A: Accelerated Growth Strategy', 'Option B: Balanced Resilience Strategy'];
      let b1 = ['Steeper learning velocity', 'Direct ownership of outcomes', 'High upside potential'];
      let r1 = ['Workload ambiguity', 'Less structured mentorship'];
      let t1 = 'Trades predictable routine for faster skill building and higher upside.';

      let b2 = ['Proven structural support and mentorship', 'Lower stress and predictable pacing', 'Clear operational benchmarks'];
      let r2 = ['Slower progression pacing', 'More rigid hierarchy'];
      let t2 = 'Trades peak speed of advancement for consistency and peace of mind.';

      if (/intern|offer|job|career/i.test(p)) {
        cat = 'Career';
        oNames = ['Fast-growing Startup Internship', 'Established Enterprise Corporate Internship'];
        b1 = ['Broad exposure across product lifecycles', 'Direct founder collaboration', 'Fast ownership of key features'];
        r1 = ['Pacing can fluctuate', 'Fewer formalized training modules'];
        t1 = 'Trades organizational stability for steep learning velocity and equity/visibility.';
        b2 = ['High resume brand recognition', 'Dedicated senior mentor and structured pathways', 'Predictable compensation & work hours'];
        r2 = ['More compartmentalized responsibilities', 'Multiple layers of reviews'];
        t2 = 'Trades direct ownership breadth for corporate prestige and structured training.';
      } else if (/laptop|data science|budget|₹/i.test(p)) {
        cat = 'Shopping';
        oNames = ['Performance Laptop (Dedicated GPU / 16GB+ RAM)', 'Portability Ultrabook (High Battery & Lightweight)'];
        b1 = ['Effortlessly trains machine learning models locally', 'High thermal stability for heavy workloads', 'Future-proof hardware specs'];
        r1 = ['Slightly heavier to carry', 'Pushes near the top of the budget'];
        t1 = 'Trades lightweight all-day battery mobility for raw local compute power.';
        b2 = ['Effortless daily portability across classes', 'Superior battery longevity and build quality', 'Easily fits within budget limit'];
        r2 = ['Requires cloud GPU instances for deep learning workflows'];
        t2 = 'Trades local compute power for everyday ergonomic convenience.';
      } else if (/deadline|week/i.test(p)) {
        cat = 'Planning';
        oNames = ['High-Impact Triage (Tackle Core Dependencies First)', 'Timeboxed Execution with Strategic Scoping'];
        b1 = ['Secures essential requirements early', 'Prevents last-minute crunch on high-value items'];
        r1 = ['Requires deprioritizing non-essential deliverables'];
        t1 = 'Trades comprehensive completion for flawless delivery on highest-leverage items.';
        b2 = ['Maintains steady momentum across all tracks', 'Reduces cognitive fatigue'];
        r2 = ['Demands strict adherence to timers without perfectionism'];
        t2 = 'Trades granular perfection on any single track for across-the-board completion.';
      } else if (/skill|learn|deepen/i.test(p)) {
        cat = 'Education';
        oNames = ['Vertical Mastery (Deepen Primary Domain)', 'Horizontal Expansion (Acquire Adjacent Skills)'];
        b1 = ['Establishes standout domain expertise', 'Immediate competitive edge in specialized roles'];
        r1 = ['Can narrow perspective if adjacent toolchains evolve'];
        t1 = 'Trades general flexibility for deep, authoritative capability.';
        b2 = ['Builds versatile T-shaped profile', 'Greater synergy across cross-functional problems'];
        r2 = ['Initial beginner learning curve slows short-term output'];
        t2 = 'Trades quick mastery of one tool for multifaceted problem-solving ability.';
      }

      const twinCtx = [
        (twin.goals && twin.goals.length) ? `Aligned with your goal: "${twin.goals[0]}"` : 'Aimed at long-term trajectory and momentum',
        (twin.priorities && twin.priorities.length) ? `Prioritizing "${twin.priorities[0]}" as key criterion` : 'Balanced against immediate quality of execution',
        (twin.constraints && twin.constraints.length) ? `Respecting constraint: "${twin.constraints[0]}"` : 'Respecting realistic schedule and budget bounds'
      ];

      return {
        understood: `You are evaluating a key ${cat.toLowerCase()} decision: "${prob.slice(0, 75)}${prob.length > 75 ? '...' : ''}", weighing immediate benefits against your defined Twin values.`,
        twin_context: twinCtx,
        live_context: {
          needed: Boolean(p.match(/price|flight|today|tomorrow|latest|current/i)),
          note: 'Live market or pricing checks would add fine-grained precision.'
        },
        options: [
          {
            name: oNames[0],
            summary: 'A proactive approach maximizing growth, upside, and accelerated capability.',
            benefits: b1,
            risks: r1,
            tradeoffs: t1,
            requirements: ['Dedicated weekly focus blocks', 'Proactive communication'],
            scores: { goal_alignment: 5, preference_fit: 4, constraint_fit: 3, practicality: 4, evidence_strength: 4 },
            scenario: 'Over the coming months, you achieve a steep milestone curve, requiring deliberate pacing to manage energy.',
            next_step: 'Identify 2 non-negotiable success indicators and clarify day-one expectations.'
          },
          {
            name: oNames[1],
            summary: 'A resilient approach designed to ensure consistency, clarity, and dependable results.',
            benefits: b2,
            risks: r2,
            tradeoffs: t2,
            requirements: ['Standard milestone tracking', 'Clear boundary setting'],
            scores: { goal_alignment: 4, preference_fit: 4, constraint_fit: 5, practicality: 5, evidence_strength: 4 },
            scenario: 'You preserve mental clarity and maintain steady execution without risking scheduling friction.',
            next_step: 'Set concrete milestone dates and protect regular deep-work windows.'
          }
        ],
        guidance: `Based on your Twin profile, "${oNames[0]}" emphasizes high-velocity growth, whereas "${oNames[1]}" offers superior stability and lower friction against your baseline constraints. Consider which phase of momentum best matches your current life stage. The final decision is completely yours.`,
        confidence: {
          level: 'High',
          why: 'Your stated priorities and constraints provide clear objective scoring criteria.'
        },
        uncertainties: [
          'Possible unexpected shifts in team workload or external expectations',
          'Evolving personal preferences over time'
        ],
        memory_candidates: [
          {
            kind: 'preference',
            content: `Analyzed tradeoff between ${oNames[0]} and ${oNames[1]}`,
            valid_until: null
          }
        ]
      };
    }

    if (prompt.includes('The user corrected their Twin')) {
      const prob = extractTag(prompt, 'problem');
      const twinRaw = extractTag(prompt, 'twin');
      let twin = { goals: [], priorities: [], preferences: [], constraints: [] };
      try { twin = JSON.parse(twinRaw); } catch(e) {}

      const isTemp = /this week|temporarily|for now|today|exams this week/i.test(prob);
      const newTwin = structuredClone(twin);

      if (/money|salary|budget|cost|financial/i.test(prob)) {
        newTwin.priorities = ['Financial stability and compensation', ...(newTwin.priorities || []).filter(x => !/financial|money/i.test(x))];
      } else if (/time|hour|schedule|busy/i.test(prob)) {
        newTwin.constraints = ['Protected daily hours and schedule boundaries', ...(newTwin.constraints || [])];
      } else if (/remote|wfh|flex/i.test(prob)) {
        newTwin.preferences = ['Remote / flexible work environment', ...(newTwin.preferences || [])];
      } else {
        newTwin.priorities = [prob, ...(newTwin.priorities || [])];
      }

      return {
        changed: !isTemp,
        temporary: isTemp,
        previous: (twin.priorities && twin.priorities[0]) || 'Initial baseline',
        new: prob,
        evidence: `"${prob}"`,
        new_twin: newTwin
      };
    }

    return {};
  }

  window.claude = {
    use: async function(service) {
      if (service === 'downloads') {
        return {
          save: async ({ filename, data }) => {
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename || 'selfctrl-data.json';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 200);
          }
        };
      }
      if (service === 'db' || service === 'user') {
        return null;
      }
      if (service === 'sample') {
        return {
          json: async function(prompt, options) {
            if (options && typeof options.onText === 'function') {
              options.onText({ text: 'Consulting Gemini intelligence engine...' });
            }
            const liveResult = await callGeminiBackend(prompt, options?.modelTier);
            if (liveResult) return liveResult;
            return simulateOffline(prompt, options);
          }
        };
      }
      return null;
    }
  };
})();
</script>

const STABS=[['profile','Profile'],['ai','Gemini AI Key'],['privacy','Privacy'],['memory','Memory'],['sources','Connected data sources'],['security','Security'],['account','Account']];
function vSet(){const t=S.twin,P=S.prefs,kVal=getActiveKey(),isOldToken=(localStorage.getItem('selfctrl.gemini_key')||'').startsWith('AQ.'),hasK=Boolean(kVal)||hasServerKey(),pn={profile:`<h2>Profile</h2><label for="sn">Display name</label><input id="sn" value="${esc(t.name||'')}"><div style="margin-top:10px"><button class="btn sm" data-act="savename">Save</button></div><p><small class="mut">Goals, priorities and the rest are edited on My Twin.</small></p>`,
ai:`<h2>Google Gemini AI Configuration</h2>
<label for="gemini_key">Personal Gemini API Key (optional)</label>
<p style="margin:0 0 6px"><small class="mut">${hasServerKey()?'✓ This site already has a shared key configured on the server. You only need to enter a key here if you want to use your own.':'Server key not detected yet.'}</small></p>
<div class="row" style="margin-bottom:8px">
  <input type="text" id="gemini_key" placeholder="AIzaSy..." value="${esc(kVal)}" style="flex:1;min-width:220px;font-family:monospace">
  <button class="btn sm" data-act="save_gemini_key">Save Key</button>
  <button class="btn ghost sm" data-act="clear_gemini_key">Clear</button>
  <button class="btn ghost sm" data-act="test_gemini_key">Test Connection</button>
</div>
${isOldToken ? `
<div class="note" style="border-left-color:var(--warn);margin:8px 0;padding:10px 12px;background:rgba(180,83,9,0.08);border-radius:6px">
  <b>⚠️ Expired Token Detected:</b> The key above starts with <code>AQ...</code>, which is an expired temporary Google Cloud token.
  <br>Click <b>Clear</b> above, then paste a permanent API key from <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" style="color:var(--acc);font-weight:600;text-decoration:underline">Google AI Studio</a> (starts with <code>AIzaSy...</code>) and click <b>Save Key</b>.
</div>` : `
<p style="margin:4px 0 8px"><small class="mut">Get a free permanent API key from <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" style="color:var(--acc);text-decoration:underline">Google AI Studio</a> (key starts with <code>AIzaSy...</code>).</small></p>
`}
<small id="gemini_key_status" class="mut">${hasK?'<span style="color:var(--ok)">✓ Gemini API key is configured. Click "Test Connection" to verify.</span>':(isOldToken?'<span style="color:var(--warn)">Please replace the expired token with an AIzaSy... key.</span>':'No key detected. Ask the site owner to set GEMINI_API_KEY on the server, or enter your own key above.')}</small>
<label for="pref_model" style="margin-top:16px">Gemini Model</label>
<select id="pref_model">
  <option value="gemini-3.1-flash-lite" ${(P.model||'gemini-3.1-flash-lite')==='gemini-3.1-flash-lite'?'selected':''}>Gemini 3.1 Flash Lite (Recommended - High Quota & Fast)</option>
  <option value="gemini-3.8-flash" ${P.model==='gemini-3.8-flash'?'selected':''}>Gemini 3.8 Flash (Comprehensive)</option>
  <option value="gemini-3.5-flash" ${P.model==='gemini-3.5-flash'?'selected':''}>Gemini 3.5 Flash</option>
  <option value="gemini-3.1-pro-preview" ${P.model==='gemini-3.1-pro-preview'?'selected':''}>Gemini 3.1 Pro (Deep reasoning)</option>
</select>
<label for="pref_len" style="margin-top:14px">Answer length</label>
<select id="pref_len">${['concise','balanced','detailed'].map(o=>`<option ${P.len===o?'selected':''}>${o}</option>`).join('')}</select>
<p><small class="mut">The shared key is kept on the server and is never sent to your browser.</small></p>`,
privacy:`<h2>Privacy: what my Twin knows</h2><div class="stats">${FIELDS.map(f=>`<div class="stat"><b>${(t[f]||[]).length}</b><small>${f}</small></div>`).join('')}<div class="stat"><b>${S.memories.length}</b><small>memories</small></div><div class="stat"><b>${S.problems.length}</b><small>problems</small></div><div class="stat"><b>${S.docs.length}</b><small>documents</small></div></div><p><b>Why it’s stored:</b> to personalize analyses.<br><b>Where it came from:</b> only what you entered or approved.<br><b>Where it lives:</b> local browser storage & local project environment.<br><b>Correct it:</b> My Twin and Memory. <b>Delete it:</b> Account.</p>`,
memory:`<h2>Memory</h2><label><input type="checkbox" id="pref_suggest" style="width:auto" ${P.suggest!==false?'checked':''}> Suggest memories to save after an analysis</label><p><small class="mut">You always approve before anything is saved.</small></p>`,
sources:`<h2>Connected data sources</h2><table><tr><th>Source</th><th>Status</th></tr>${['Google Gemini API', 'Web search','Weather','News','Products','Jobs','Maps'].map((s,i)=>`<tr><td>${s}</td><td><span class="tag">${i===0?(hasK?'Active':'Ready for Key'):'Not connected'}</span></td></tr>`).join('')}</table><div class="note">Live sources connect via local API endpoints.</div>`,
security:`<h2>Security</h2><label for="pref_theme">Appearance</label><select id="pref_theme">${['system','light','dark'].map(o=>`<option ${P.theme===o?'selected':''}>${o}</option>`).join('')}</select><p class="mut">Retrieved content is always treated as data, never instructions.</p>`,
account:`<h2>Account</h2><p>Download a copy of everything I hold, or delete it all.</p><p><button class="btn ghost" data-act="export">Download my data (JSON)</button></p><button class="btn ghost del" data-act="wipe">${wipe?'Click again to permanently delete':'Delete all my data'}</button>`};
return ph('Settings','Control what I know and how I work.')+`<div class="tabv"><div class="card lst" role="tablist">${STABS.map(([k,l])=>`<button role="tab" class="nv ${setTab===k?'on':''}" data-act="settab" data-t="${k}">${l}</button>`).join('')}</div><div class="card">${pn[setTab]}</div></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
if(a==='ex'){const q=$('#hq');q.value='';q.focus();typeInto(q,b.dataset.t,'value');return}
if(a==='go'){view=b.dataset.v;cur=null;if(view==='onboard'){OB=null;obStep=0}if(view==='solve'||view==='twin')wipe=false;render()}
else if(a==='start'){prefill=$('#hq').value;view=S.twin?'solve':'onboard';OB=null;obStep=0;cur=null;render();if(S.twin&&prefill.trim())analyze()}
else if(a==='obnext'){obSave();obStep++;render()}else if(a==='obback'){obSave();obStep--;render()}
else if(a==='saveTwin'){obSave();const t={name:OB.name.trim()||'Me'};FIELDS.forEach(f=>t[f]=OB[f].split('\n').map(x=>x.trim()).filter(Boolean));const first=!S.twin;commit(t,first?'Initial Twin from onboarding':'You edited your Twin');S.twin=t;OB=null;obStep=0;await persist();view=first&&prefill?'solve':'twin';render();if(view==='solve'&&prefill.trim())analyze()}
else if(a==='rejitem'){const t=structuredClone(S.twin),f=b.dataset.f,[x]=t[f].splice(+b.dataset.i,1);commit(t,'You rejected "'+x+'"');await persist();render()}
else if(a==='fill'){$('#ptext').value=b.dataset.t;$('#ptext').focus()}
else if(a==='memtab'){memTab=b.dataset.t;render()}else if(a==='editmem'){editId=id;render()}else if(a==='cancelmem'){editId=null;render()}
else if(a==='editsave'){const m=S.memories.find(x=>x.id===id);m.content=$('#me').value.trim()||m.content;editId=null;await persist();render()}
else if(a==='cmp'){cmpId=cmpId===+id?null:+id;render()}else if(a==='settab'){setTab=b.dataset.t;wipe=false;render()}
else if(a==='savename'){S.twin.name=$('#sn').value.trim()||S.twin.name;await persist();render()}
else if(a==='analyze')analyze();else if(a==='clarify')analyze($('#cans').value.trim()||'no answer');else if(a==='skipclar')analyze('skipped');
else if(a==='newp'){cur=null;prefill='';pending=null;render()}
else if(a==='savemem'){const p=S.problems.find(x=>x.id===cur),m=p.an.memory_candidates[+b.dataset.i];if(dupMem(String(m.content))){toast('Already in your memory, skipped');return}S.memories.push({id:uidn(),kind:['semantic','episodic','preference','constraint','temporal'].includes(m.kind)?m.kind:'semantic',content:String(m.content),source:'approved from a problem',at:new Date().toISOString(),status:'active',valid_until:m.valid_until||null});(p.saved=p.saved||[]).push(+b.dataset.i);await persist();render()}
else if(a==='fb'){const p=S.problems.find(x=>x.id===cur);p.fb='You confirmed the understanding was correct';p.status='confirmed';await persist();render()}
else if(a==='fixit')fixit();
else if(a==='accept'){const v=commit(pending.new_twin,pending.evidence),p=S.problems.find(x=>x.id===cur);p.fb=v?'Twin updated to '+v.label:'No change';pending=null;await persist();render()}
else if(a==='correctu'){$('#fbt').value=pending.new;pending=null;$('#upd').innerHTML='<small>Edit the statement above and submit again.</small>'}
else if(a==='reject'){pending=null;$('#upd').innerHTML='<small>Update rejected. Your Twin is unchanged.</small>'}
else if(a==='open'){cur=id;view='solve';render()}else if(a==='delp'){S.problems=S.problems.filter(p=>p.id!==id);await persist();render()}
else if(a==='addmem'){const c=$('#mc').value.trim();if(!c)return;if(dupMem(c)){toast('That is already in your memory');return}S.memories.push({id:uidn(),kind:$('#mk').value,content:c,source:'you',at:new Date().toISOString(),status:'active',valid_until:$('#mv').value||null});await persist();render()}
else if(a==='togmem'){const m=S.memories.find(x=>x.id===id);m.status=m.status==='active'?'rejected':'active';await persist();render()}
else if(a==='delmem'){S.memories=S.memories.filter(x=>x.id!==id);await persist();render()}
else if(a==='rollback'){const t=S.versions.find(v=>v.id===+id);commit(t.snapshot,'Rolled back to '+t.label);await persist();render()}
else if(a==='deldoc'){S.docs=S.docs.filter(d=>d.id!==id);await persist();render()}
else if(a==='export'){const d=await claude.use('downloads');if(!d){toast('Downloads are not available here');return}try{await d.save({filename:'selfctrl-data.json',data:JSON.stringify(S,null,2)})}catch(e){}}
else if(a==='accsit'){S.memories.push({id:uidn(),kind:'temporal',content:pending.new,source:'your correction (situation-specific)',at:new Date().toISOString(),status:'active',valid_until:new Date(Date.now()+30*864e5).toISOString().slice(0,10)});S.problems.find(x=>x.id===cur).fb='Saved as situation-specific; Twin unchanged';pending=null;await persist();render()}
else if(a==='accboth'){const t=structuredClone(pending.new_twin);FIELDS.forEach(f=>t[f]=[...new Set([...(S.twin[f]||[]),...(t[f]||[])])]);commit(t,'You kept both old and new: '+pending.new);S.problems.find(x=>x.id===cur).fb='Twin updated (kept both)';pending=null;await persist();render()}
else if(a==='wipe'){if(!wipe){wipe=true;render();return}S={twin:null,versions:[],memories:[],problems:[],docs:[],prefs:{len:'balanced',suggest:true,theme:'system',model:'gemini-3.1-flash-lite'}};wipe=false;await persist();view='home';render()}
else if(a==='save_gemini_key'){
  const k=($('#gemini_key').value||'').trim(),m=($('#pref_model')?.value||'gemini-3.1-flash-lite').trim();
  localStorage.setItem('selfctrl.gemini_key',k);
  localStorage.setItem('selfctrl.gemini_model',m);
  S.prefs.model=m;
  try{await fetch('/api/save-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:k,model:m})})}catch(e){}
  if(k.startsWith('AQ.')){
    toast('Warning: AQ... tokens are temporary and expire.');
  } else {
    toast(k?'Gemini API Key saved!':'Key cleared');
  }
  render();
}
else if(a==='clear_gemini_key'){
  localStorage.removeItem('selfctrl.gemini_key');
  try{await fetch('/api/save-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:'',model:S.prefs.model})})}catch(e){}
  toast('Gemini key cleared');
  render();
}
else if(a==='test_gemini_key'){
  const k=($('#gemini_key').value||'').trim()||localStorage.getItem('selfctrl.gemini_key')||'';
  const m=($('#pref_model')?.value||'gemini-3.1-flash-lite').trim();
  const st=$('#gemini_key_status');
  if(st)st.textContent='Testing connection to Google Gemini ('+m+')...';
  try{
    const r=await window.testGeminiConnection(k,m);
    if(k)localStorage.setItem('selfctrl.gemini_key',k);
    localStorage.setItem('selfctrl.gemini_model',m);
    S.prefs.model=m;
    if(st){st.innerHTML='<span style="color:var(--ok)">✓ Successfully connected to Google Gemini ('+esc(m)+') via '+esc(r.via)+'!</span>';}
    toast('✓ Gemini connection successful!');
  }catch(err){
    if(st){st.innerHTML='<span style="color:var(--warn)">✕ Connection error: '+esc(err.message)+'</span>';}
    toast('Connection error: '+err.message);
  }
}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='pref_len')S.prefs.len=t.value;else if(t.id==='pref_model')S.prefs.model=t.value;else if(t.id==='pref_theme'){S.prefs.theme=t.value;applyTheme()}else if(t.id==='pref_suggest')S.prefs.suggest=t.checked;else if(t.id==='docf'){for(const f of t.files){if(!/\.(txt|md|csv|json)$/i.test(f.name)){toast(f.name+': only text files are supported (no PDF yet)');continue}if(f.size>200000){toast(f.name+' is over 200 KB');continue}const tx=await f.text();S.docs.push({id:uidn(),name:f.name,at:new Date().toISOString(),chunks:chunkText(tx).slice(0,300),flags:INJ.filter(r=>r.test(tx)).length})}await persist();render();return}else if(t.id==='hfs'){hS=t.value;$('#hl').innerHTML=histList();return}else return;await persist()});document.addEventListener('input',e=>{if(e.target.id==='dq'){$('#dr').innerHTML=topChunks(e.target.value,4).map(c=>`<p><b>${esc(c.d)}</b><br><small>${esc(c.c.slice(0,260))}</small></p>`).join('')||'<small class="mut">No matches</small>'}if(e.target.id==='hfq'){hQ=e.target.value;$('#hl').innerHTML=histList()}});
fetch('/api/config').then(r=>{const c=r.headers.get('content-type')||'';return (r.ok&&c.includes('application/json'))?r.json():null}).then(cfg=>{localStorage.setItem('selfctrl.has_server_key',cfg&&cfg.hasKey?'true':'false');if(cfg&&cfg.model)S.prefs.model=cfg.model;render()}).catch(()=>{});
load().then(()=>{applyTheme();view='home';render()});render();
</script></body></html>
